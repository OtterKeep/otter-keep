name: Release & Homebrew Dispatch

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Package & Publish
    runs-on: macos-15
    steps:
      - name: Checkout otter-keep
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: vars
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Triggered release for tag: $TAG_NAME (version: $VERSION)"

      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Application and Create Distribution Artifacts
        run: |
          chmod +x ./scripts/build_release.sh
          ./scripts/build_release.sh "${{ steps.vars.outputs.version }}" release

      - name: Calculate SHA-256 Checksums
        id: checksum
        run: |
          DMG_PATH=".build/dist/OtterKeep-${{ steps.vars.outputs.version }}.dmg"
          ZIP_PATH=".build/dist/OtterKeep-${{ steps.vars.outputs.version }}.zip"

          if [ ! -f "$DMG_PATH" ]; then
            echo "::error::DMG file was not found at: $DMG_PATH"
            exit 1
          fi

          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "DMG SHA-256: $DMG_SHA256"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP file was not found at: $ZIP_PATH"
            exit 1
          fi

          ZIP_SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "ZIP SHA-256: $ZIP_SHA256"

      - name: Sign Sparkle Update (Ed25519)
        id: sparkle_sign
        if: env.SPARKLE_ED_KEY != ''
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          ZIP_PATH=".build/dist/OtterKeep-${{ steps.vars.outputs.version }}.zip"
          if [ -f "$ZIP_PATH" ]; then
            echo "Signing Sparkle update for $ZIP_PATH..."
            SIGN_UPDATE=$(find .build -name "sign_update" -type f -perm +111 2>/dev/null | head -n 1)
            if [ -n "$SIGN_UPDATE" ]; then
              SIG_OUTPUT=$("$SIGN_UPDATE" -s "$SPARKLE_ED_KEY" "$ZIP_PATH" 2>/dev/null || true)
              echo "Sparkle signature output: $SIG_OUTPUT"
            else
              echo "Note: sign_update binary not found in build artifacts; skipping signing."
            fi
          fi

      - name: Commit Updated Appcast if Modified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain Distribution/appcast.xml) ]]; then
            git add Distribution/appcast.xml
            git commit -m "chore(appcast): update Sparkle feed for ${{ steps.vars.outputs.tag }}" || true
            git push origin HEAD:main || true
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "OtterKeep ${{ steps.vars.outputs.version }}"
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            .build/dist/OtterKeep-${{ steps.vars.outputs.version }}.dmg
            .build/dist/OtterKeep-${{ steps.vars.outputs.version }}.dmg.sha256
            .build/dist/OtterKeep-${{ steps.vars.outputs.version }}.zip
            .build/dist/OtterKeep-${{ steps.vars.outputs.version }}.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Checkout homebrew-otterkeep Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-otterkeep
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-repo

      - name: Update Homebrew Cask Formula
        run: |
          cd homebrew-repo
          CASK_FILE="Casks/otterkeep.rb"
          NEW_VERSION="${{ steps.vars.outputs.version }}"
          NEW_SHA256="${{ steps.checksum.outputs.zip_sha256 }}"

          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::Cask formula not found: $CASK_FILE"
            exit 1
          fi

          if [ -z "$NEW_SHA256" ]; then
            echo "::error::ZIP SHA-256 checksum is empty or missing"
            exit 1
          fi

          # Update version and sha256 in Casks/otterkeep.rb
          sed -i '' -E "s/version \"[^\"]+\"/version \"$NEW_VERSION\"/" "$CASK_FILE"
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"$NEW_SHA256\"/" "$CASK_FILE"

          # Verify changes
          git diff "$CASK_FILE"

          # Git commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "bump(cask): update otterkeep to v$NEW_VERSION"
          git push origin main
