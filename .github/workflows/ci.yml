name: CI

on:
  push:
    branches: [ "main", "release/**", "release/*", "release-*" ]
  pull_request:
    branches: [ "main", "release/**", "release/*", "release-*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS 15 / Swift 6.0)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build all targets (Release)
        run: swift build -c release

      - name: Verify version consistency
        # Fails when version.json, CoreEngine.swift, package_app.sh and appcast.xml drift apart.
        run: scripts/sync_version.sh --check

      - name: Run Integration Test Suite
        # Runs `swift test` serially: the 12 integration modules exercise process-wide singletons
        # and fixed paths. The wrapper retries only the toolchain's TestingMacros plugin-loading
        # failure (see scripts/test.sh) and reports real test failures immediately.
        run: scripts/test.sh -c release

      - name: Formatting report (advisory)
        # The repository still carries ~2.7k pre-existing style violations, so this step
        # reports them instead of failing. Use scripts/format.sh to fix touched files.
        run: scripts/format.sh --lint || true
